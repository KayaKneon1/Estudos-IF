<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exemplo 1</title>
  </head>
  <body>
    <form name="selectForm">
      <p>
        <label for="tipoMusica"
          >Escolha alguns tipos de música, em seguida, clique no botão
          abaixo:</label
        >
        <select id="tipoMusica" name="tipoMusica" multiple="multiple">
          <option selected="selected">R&B</option>
          <option>Jazz</option>
          <option>Blues</option>
          <option>New Age</option>
          <option>Classico</option>
          <option>Ópera</option>
        </select>
      </p>
      <p>
        <input id="btn" type="button" value="Quantos foram selecionados?" />
      </p>
    </form>
  </body>
</html>
<script>
function howMany(selectObject) {
  var numeroSelecionadas = 0;
  for (var option of selectObject.options) {
    if (option.selected) {
      numeroSelecionadas++;
    }
  }
  return numeroSelecionadas;
}

var btn = document.getElementById("btn");
btn.addEventListener("click", function () {
  alert(
    "Total de opções selecionadas: " +
      howMany(document.selectForm.tipoMusica),
  );
});
</script>
