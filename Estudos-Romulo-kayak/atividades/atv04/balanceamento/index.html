<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Balanceamento de parênteses</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <main class="card">
        <h1>Balanceamento de parênteses</h1>
        <p class="intro">Digite uma expressão. A pilha verifica se cada parêntese aberto possui um fechamento correspondente.</p>

        <form id="expression-form">
            <label for="expression">Expressão</label>
            <input id="expression" name="expression" type="text" placeholder="Ex.: (a + b) * (c - d)" autocomplete="off" required>
            <button type="submit">Verificar expressão</button>
        </form>

        <p id="result" class="message" role="status" aria-live="polite" hidden></p>
    </main>
    <script src="main.js"></script>
</body>
</html>
