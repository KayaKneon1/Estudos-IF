<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Histórico de edição</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <main class="card">
        <h1>Histórico de edição</h1>
        <p class="intro">Digite seu texto e use o botão ou <kbd>Ctrl</kbd> + <kbd>Z</kbd> para voltar ao estado anterior.</p>

        <label for="text-editor">Seu texto</label>
        <textarea id="text-editor" rows="10" placeholder="Comece a digitar..."></textarea>
        <div class="actions">
            <button id="undo-button" type="button" disabled>Desfazer (Ctrl+Z)</button>
            <span id="history-status" aria-live="polite">Nenhuma edição para desfazer.</span>
        </div>
    </main>
    <script src="main.js"></script>
</body>
</html>
