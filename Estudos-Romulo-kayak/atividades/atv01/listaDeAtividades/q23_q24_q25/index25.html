<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>questão 25</title>
  </head>
<body>
    <div id="main" class="h-screen flex items-center justify-center">
        <form 
            class="bg-gray-300 shadow-md rounded px-8 pt-6 pb-8 mb-4"
            id="meuForm" action="" method="get"
            >
            <div class="mb-4 ">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="texto">
                    Digite um texto para contar quantas vezes a letra 'A, E, I, O, U' aparece
                </label>
            <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
            type="text" name="texto" id="texto" placeholder="Digite seu texto aqui...">
            </div>
            
            <div class="flex items-center justify-center">
                <input class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="submit" value="Contar">
            </div>
        </form>
    </div>
    <script>

        document.getElementById("meuForm").addEventListener("submit", function (e){
        e.preventDefault()

        let textoInput = document.getElementById("texto")
        let texto = textoInput.value

        let vogais = "aeiouAEIOU";

        let contador = 0;

        for (let i = 0; i < texto.length; i++) {
            if (vogais.includes(texto[i])) {
                contador++;
            }
        }


        document.getElementById("meuForm").remove()

        document.getElementById("main").innerHTML = `
        <div class='min-w-80 bg-gray-300 shadow-md rounded px-8 pt-6 pb-8 mb-4 flex flex-col'>
            <h1 class='font-bold text-lg mb-2'> 
            Resultado: 
            </h1>
            <div class='bg-white rounded p-4 mb-2'>
                <p class='text-gray-700 text-sm'>
                   A palavra "${texto}" tem ${contador} vogais.
                </p>
            </div>
            </div>
            `
        })
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
</body>
</html>
