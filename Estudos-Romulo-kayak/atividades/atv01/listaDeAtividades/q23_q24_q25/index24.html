<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>questão 24</title>
  </head>
<body>
    <div id="main" class="h-screen flex items-center justify-center">
        <form 
            class="bg-gray-300 shadow-md rounded px-8 pt-6 pb-8 mb-4"
            id="meuForm" action="" method="get"
            >
            <div class="mb-4 ">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="numeros">
                  Digite uma lista de números separados por vírgula
                </label>
            <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
            type="text" name="numeros" id="numeros" placeholder="Ex: 10, 20, 30, 40, 50">
            </div>
            
            <div class="flex items-center justify-center">
                <input class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="submit" value="Calcular Média">
            </div>
        </form>
    </div>
    <script>

        document.getElementById("meuForm").addEventListener("submit", function (e){
        e.preventDefault()

        let numerosInput = document.getElementById("numeros")
        let nums = numerosInput.value

        let numerosArray = nums.split(',').map(function(item) {
            return parseFloat(item.trim())
        })

        let numerosValidos = numerosArray.filter(function(num) {
            return !isNaN(num)
        })

        if (numerosValidos.length === 0) {
            alert("Por favor, digite números válidos separados por vírgula.")
            return
        }

        let soma = 0
        for (let i = 0; i < numerosValidos.length; i++) {
            soma += numerosValidos[i]
        }

        let media = soma / numerosValidos.length
        let mediaFormatada = media.toFixed(2)

        document.getElementById("meuForm").remove()

        document.getElementById("main").innerHTML = `
        <div class='min-w-80 bg-gray-300 shadow-md rounded px-8 pt-6 pb-8 mb-4 flex flex-col'>
            <h1 class='font-bold text-lg mb-2'> 
            Resultado: 
            </h1>
            <div class='bg-white rounded p-4 mb-2'>
                <p class='text-gray-700 text-sm'>
                    Números: ${numerosValidos.join(', ')}
                </p>
                <p class='text-gray-700 text-sm'>
                    Quantidade: ${numerosValidos.length} números
                </p>
                <p class='text-gray-700 text-sm'>
                    Soma: ${soma}
                </p>
            </div>
            <p class='text-center text-xl text-blue-600 font-bold'>
                Média: ${mediaFormatada}
            </p>
            </div>
            `
        })
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
</body>
</html>
