<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arrays - Lab 05 (Pesquisa Binária Dinâmica)</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-100">
    <div id="main" class="h-screen flex items-center justify-center flex-col">
      <div
        class="bg-gray-300 shadow-md rounded px-8 pt-6 pb-8 mb-4 w-1/2 h-auto"
      >
        <h1 class="text-xl font-extrabold leading-normal my-6 text-gray-900">
          Lab 05 - Pesquisa Binária
        </h1>
        <div class="mb-4">
          <div class="flex items-center justify-center">
            <input
              class="w-full py-2 px-4 text-gray-700 focus:outline-none focus:shadow-outline rounded-l"
              type="number"
              id="elemento"
              placeholder="Digite um valor para adicionar"
            />

            <button
              id="btn-push"
              class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-r focus:outline-none focus:shadow-outline"
            >
              push
            </button>
          </div>
        </div>

        <div class="mb-4">
          <div class="flex items-center justify-center">
            <input
              class="w-full py-2 px-4 text-gray-700 focus:outline-none focus:shadow-outline rounded-l"
              type="number"
              id="valor-busca"
              value="5"
              placeholder="Digite o valor para buscar"
            />

            <button
              id="btn-bin"
              class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-r focus:outline-none focus:shadow-outline"
            >
              pesquisar binaria
            </button>
          </div>
        </div>

        <div class="mb-8 flex justify-center">
          <button
            id="btn-sort"
            class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded w-full focus:outline-none focus:shadow-outline"
          >
            sort (Ordenar Array)
          </button>
        </div>

        <div class="mb-2">
          <p class="text-gray-800 mb-2">Veja os dados do seu array</p>

          <div
            id="array-container"
            class="bg-[#005f8f] p-4 rounded flex flex-wrap gap-2 justify-start min-h-[60px]"
          ></div>
        </div>

        <div id="resultado" class="mt-4 text-gray-800 font-medium"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
