<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora</title>
  </head>
  <body>
    <form action="http://localhost:3000/calculadora" method="get">
      <input type="number" id="num1" name="num1" placeholder="Digite o número" />
      <select id="op" name="op">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
      </select>
      <input type="number" id="num2" name="num2" placeholder="outro número" />
      <input type="submit" />
    </form>

    <p id="resultado"></p>
  </body>
</html>
