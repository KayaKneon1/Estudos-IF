<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar livro</title>
</head>
<body>
    <h1>Editar Livro</h1>
    <form method="post">
        {% csrf_token %}
        <label for="titulo">Título:</label>
        <input type="text" name="titulo" id="titulo" value="{{ livro.titulo }}" required>
        <br>
        <label for="autor">Autor:</label>
        <input type="text" name="autor" id="autor" value="{{ livro.Autor }}" required>
        <br>
        <label for="ano">Ano:</label>
        <input type="number" name="ano" id="ano" value="{{ livro.Ano }}" required>
        <br>
        <label for="data">Data:</label>
        <input type="date" name="data" id="data" value="{{ livro.Data|date:'Y-m-d' }}" required>
        <br>
        <button type="submit">Salvar</button>
    </form>
    <a href="{% url 'home' %}">Voltar</a>
</body>
</html>
