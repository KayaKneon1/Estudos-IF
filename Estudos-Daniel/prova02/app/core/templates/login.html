<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
</head>
<body>
    <form action="{% url 'login' %}" method="post">
        {% csrf_token %}
        {% if form.errors %}<p>Email ou senha incorretos.</p>{% endif %}
        <label for="email">Email:</label>
        <input type="email" id="email" name="username" required><br><br>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="password" required><br><br>

        <input type="submit" value="Login">
    </form>
    <h2>Não tem uma conta? <a href="{% url 'cadastro' %}">Cadastre-se</a></h2>
</body>
</html>
