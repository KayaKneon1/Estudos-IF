<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f6fa">
    <title>Lista de produtos | Projeto 3</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
</head>
<body>
    <main class="container">
        <header class="page-header">
            <p class="eyebrow">Projeto 3</p>
            <h1>Lista de produtos</h1>
            <p class="subtitle">Cadastre e organize seus produtos.</p>
        </header>

        <section class="panel" aria-labelledby="form-title">
            <h2 id="form-title">Adicionar produto</h2>
            <form id="product-form">
                <label for="nome">Nome</label>
                <input id="nome" name="nome" type="text" maxlength="120" required>

                <label for="preco">Preço (R$)</label>
                <input id="preco" name="preco" type="number" min="0" step="1" required>

                <div class="form-actions">
                    <button class="button button-primary" type="submit" id="submit-button">Adicionar produto</button>
                    <button class="button button-secondary" type="button" id="cancel-button" hidden>Cancelar edição</button>
                </div>
            </form>
            <p id="form-message" class="message" role="status" aria-live="polite"></p>
        </section>

        <section class="panel" aria-labelledby="list-title">
            <div class="list-heading">
                <h2 id="list-title">Produtos cadastrados</h2>
                <span id="product-count" class="count">0 produtos</span>
            </div>
            <p id="list-message" class="message" role="status" aria-live="polite">Carregando produtos...</p>
            <ul id="product-list" class="product-list"></ul>
        </section>
    </main>
</body>
</html>
